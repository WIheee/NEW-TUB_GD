// 发布签名：keystore.properties 存在时自动启用；不存在则产出未签名包，不阻断构建。
// 证书与口令都在仓库外（.gitignore 已排除），换机时记得一起备份。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'com.godot.tub.gd'
    compileSdk 37
    buildToolsVersion '37.0.0'
    ndkVersion = '30.0.15729638'

    defaultConfig {
        applicationId 'com.godot.tub.gd'
        minSdk 28
        targetSdk 34
        versionCode 184
        versionName 'B2'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters.add('arm64-v8a')
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeType(keystoreProperties['storeType'] ?: 'PKCS12')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '4.1.2'
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.documentfile
    
    // Compose 依赖
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.animation
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
        implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.material.icons.extended
    debugImplementation libs.androidx.ui.tooling
}
